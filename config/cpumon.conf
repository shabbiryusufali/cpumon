# cpumon daemon configuration
#
# Read by `cpumon --daemon` (the cpumon.service systemd unit passes
# --config /etc/cpumon/cpumon.conf). Edit any value below, then apply it
# without a restart:
#
#   sudo systemctl reload cpumon
#
# For the interactive display, put the same KEY=VALUE settings in
# ~/.config/cpumon/cpumon.conf instead. CPUMON_* environment variables
# override this file, and command-line options override both.
#
# This file is preserved across package upgrades.

# How often the daemon samples /proc/stat and appends a snapshot to
# today's log file. Accepts a plain number of seconds or a suffix:
# s (seconds), m (minutes), h (hours), d (days).
CPUMON_INTERVAL=5m

# Directory holding the daily log files (YYYY-MM-DD.log / .jsonl / .csv).
# If you move it outside /var/log/cpumon, also allow the new path in the
# unit (systemctl edit cpumon -> ReadWritePaths=...).
CPUMON_LOG_DIR=/var/log/cpumon

# Log format: text (human-readable sections), json (one JSON object per
# line, .jsonl) or csv (one row per snapshot, .csv).
CPUMON_FORMAT=text

# Where snapshots go: file (daily log files), journal (the systemd
# journal, with structured CPUMON_* fields) or both.
CPUMON_LOG_TARGET=file

# Log files older than this many days are deleted automatically.
# Set to 0 to keep logs forever (auto-delete disabled).
CPUMON_LOG_RETENTION_DAYS=30

# Log files at least this many days old are gzip-compressed
# (YYYY-MM-DD.log.gz). `cpumon --replay` reads them transparently.
# Set to 0 to never compress.
CPUMON_COMPRESS_AFTER_DAYS=1

# How many of the busiest processes to record with each snapshot.
# Set to 0 to skip scanning /proc/[pid] entirely.
CPUMON_TOP=5

# Alert (syslog/journal warning plus a line in the log) when total CPU
# usage stays at or above this percentage for CPUMON_ALERT_DURATION.
# Set to 0 to disable alerts.
CPUMON_ALERT_THRESHOLD=0
CPUMON_ALERT_DURATION=10m
